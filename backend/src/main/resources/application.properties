spring.application.name=studyflow-backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyflow}
spring.datasource.username=${DB_USERNAME:studyflow_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8081

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000